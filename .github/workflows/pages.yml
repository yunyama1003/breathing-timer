name: Publish breathing PWA
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/build-pwa.cjs', 'src/main/resources/static/js/breathing-timer.js', 'src/test/js/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test src/test/js/*.test.js
      - run: node scripts/build-pwa.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pwa
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
