<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>呼吸記録登録</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        form {
            max-width: 400px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 6px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 10px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #357ab8;
        }
		.error {
		    color: red;
		    font-size: 0.9em;
		    margin-top: 4px;
		}
        @media (max-width: 600px) {
            body { padding: 20px 12px; }
            form { padding: 20px; }
        }
    </style>
</head>
<body>

<h1>呼吸記録 登録</h1>

<form th:action="@{/breathing/save}" th:object="${recordForm}" method="post">
    <label for="inhaleSeconds">吸う（秒）</label>
    <input type="number" th:field="*{inhaleSeconds}" required min="1" max="30" step="1" aria-describedby="inhaleSeconds-error">
    <p id="inhaleSeconds-error" class="error" th:if="${#fields.hasErrors('inhaleSeconds')}" th:errors="*{inhaleSeconds}"></p>

    <label for="holdSeconds">止める（秒）</label>
    <input type="number" th:field="*{holdSeconds}" required min="0" max="30" step="1" aria-describedby="holdSeconds-error">
    <p id="holdSeconds-error" class="error" th:if="${#fields.hasErrors('holdSeconds')}" th:errors="*{holdSeconds}"></p>

    <label for="exhaleSeconds">吐く（秒）</label>
    <input type="number" th:field="*{exhaleSeconds}" required min="1" max="30" step="1" aria-describedby="exhaleSeconds-error">
    <p id="exhaleSeconds-error" class="error" th:if="${#fields.hasErrors('exhaleSeconds')}" th:errors="*{exhaleSeconds}"></p>

    <label for="cycleCount">回数</label>
    <input type="number" th:field="*{cycleCount}" required min="1" max="20" step="1" aria-describedby="cycleCount-error">
    <p id="cycleCount-error" class="error" th:if="${#fields.hasErrors('cycleCount')}" th:errors="*{cycleCount}"></p>

    <button type="submit">保存してタイマーへ</button>
</form>

</body>
</html>
