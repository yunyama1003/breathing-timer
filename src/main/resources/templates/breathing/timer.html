<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
	<head>
	    <meta charset="UTF-8">
	    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	    <title>呼吸タイマー</title>


    <style>
        body {
            text-align: center;
            font-family: sans-serif;
            margin-top: 40px;
        }

        .circle-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
        }

        #breathingCircle {
            width: 120px;
            height: 120px;
            background-color: #4a90e2;
            border-radius: 50%;
            transform: scale(1.0);
        }

        #phase {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        #time {
            font-size: 32px;
            margin-top: 10px;
        }

        #cycle {
            margin-top: 10px;
        }

        button {
            margin-top: 30px;
            font-size: 18px;
            padding: 10px 30px;
        }
		button:disabled { cursor: not-allowed; opacity: 0.6; }
		@media (max-width: 600px) {
		    body {
		        margin-top: 0;
		        height: 100vh;
		        display: flex;
		        flex-direction: column;
		        justify-content: center;
		    }

		    #breathingCircle {
		        width: 220px;
		        height: 220px;
		    }

		    #phase {
		        font-size: 28px;
		    }

		    #time {
		        font-size: 48px;
		    }

		    button {
		        font-size: 20px;
		        padding: 14px 36px;
		    }
		}

    </style>
</head>

<body id="timerApp"
      th:attr="data-inhale-seconds=${record.inhaleSeconds},data-hold-seconds=${record.holdSeconds},data-exhale-seconds=${record.exhaleSeconds},data-cycle-count=${record.cycleCount},data-sound-url=@{/sound/change.mp3}">

<h1>呼吸タイマー</h1>

<p id="cycle">サイクル: 0</p>
<p id="phase">準備</p>
<p id="time"></p>

<button id="startBtn" type="button">スタート</button>
<button id="pauseBtn" type="button" disabled>一時停止</button>
<button id="resetBtn" type="button">リセット</button>
<button id="soundBtn" type="button" aria-pressed="false">音: オン</button>



<a th:href="@{/breathing/list}">一覧に戻る</a>

<div class="circle-container">
    <div id="breathingCircle"></div>
</div>

<script th:src="@{/js/breathing-timer.js}"></script>


</body>
</html>
